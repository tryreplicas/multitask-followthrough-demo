name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md || {
            echo "::error::Every pull request must add an entry to CHANGELOG.md describing the change."
            exit 1
          }
